# .github/workflows/ci.yml
# PHP と SQLite を有効化した最小 CI。
name: reference-resolver-ci

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, mbstring, xml, zip
          tools: composer
      - name: PHPUnit 依存関係
        env:
          COMPOSER_MAX_PARALLEL_HTTP: 1
        run: |
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1
      - name: 構文検査
        run: find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan 静的解析
        run: composer analyse
      - name: スモークテスト
        run: composer test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container設定
        run: cp .env.example .env
      - name: 受入Compose設定検証
        run: |
          cp .env.acceptance.example .env.acceptance
          docker compose -f compose.acceptance.yaml config --quiet
      - name: Containerイメージ構築
        run: docker compose build
      - name: Container PHPUnit
        run: docker compose run --rm resolver composer test
      - name: Container PHPStan
        run: docker compose run --rm resolver composer analyse
      - name: Container復元権限受入れ
        run: sh bin/container-restore-acceptance.sh
