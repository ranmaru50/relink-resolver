# .github/workflows/ci.yml
# PHP と SQLite を有効化した最小 CI。
name: reference-resolver-ci

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, mbstring, xml, zip
          tools: composer
      - name: PHPUnit 依存関係
        run: composer install --no-interaction --prefer-dist
      - name: 構文検査
        run: find src public tests bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan 静的解析
        run: composer analyse
      - name: スモークテスト
        run: composer test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container設定
        run: cp .env.example .env
      - name: Containerイメージ構築
        run: docker compose build
      - name: Container PHPUnit
        run: docker compose run --rm resolver composer test
      - name: Container PHPStan
        run: docker compose run --rm resolver composer analyse
