# compose.yaml
# 永続ボリュームを利用する最小 Container profile。
services:
  resolver:
    build: .
    ports:
      # 開発用の loopback 公開。本番は TLS 終端プロキシ配下へ配置する。
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    environment:
      RELINK_DATA_DIR: /var/lib/relink-resolver
    volumes:
      - resolver-data:/var/lib/relink-resolver
volumes:
  resolver-data:
