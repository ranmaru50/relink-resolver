# deploy/apache-acceptance.conf
# Testbed の HTTP security header 受入でだけ Include/a2enconf する fault fixture。
# 通常の Native 設定には Include せず、Container image でも既定では無効にする。

# 実ファイルや PHP front controller を通さず、Apache の標準エラー応答を返す。
<LocationMatch "^/__security__/apache-error$">
    Require all denied
</LocationMatch>

# Apache の通常エラー処理を通る決定的な 503 を受入時だけ提供する。
Redirect 503 "/__security__/503"
