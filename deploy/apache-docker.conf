# deploy/apache-docker.conf
# Container 内の PHP エントリポイント、HTTP セキュリティヘッダー、private data の境界。
# 本設定は Apache のエラー応答にも適用する。
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always set X-Content-Type-Options "nosniff"
# 公開・管理の両HTTP面に共通の本文、ヘッダー、低速接続上限を適用する。
LimitRequestBody 65536
LimitRequestFields 50
LimitRequestFieldSize 8190
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
ErrorDocument 400 "要求が不正です。"
ErrorDocument 413 "要求が大きすぎます。"

Alias /relink /var/www/html
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/lib/relink-resolver>
    Require all denied
</Directory>
