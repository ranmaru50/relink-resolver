# deploy/apache-docker.conf
# Container 内の PHP エントリポイント、HTTP セキュリティヘッダー、private data の境界。
# 本設定は Apache のエラー応答にも適用する。
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always set X-Content-Type-Options "nosniff"

Alias /relink /var/www/html
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/lib/relink-resolver>
    Require all denied
</Directory>
