# deploy/apache-ssl-vhost.conf
# Container 受入 profile が Apache 自身で TLS を終端する VirtualHost。
# 証明書と秘密鍵は image/web root の外側から read-only でマウントする。
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/relink/tls/cert.pem
    SSLCertificateKeyFile /etc/relink/tls/key.pem
    # 受入 profile の外部 URL は HTTPS であることを明示する。
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
